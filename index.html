<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Security Headers - Keep as is -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'none';">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="X-Frame-Options" content="DENY">
    <meta http-equiv="Referrer-Policy" content="no-referrer">
    <title>Athena MDR Communication Demo</title>
    
    <!-- KEEP ALL YOUR ORIGINAL CSS STYLES INLINE -->
    <style nonce="style-nonce">
        /* Reset & Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        .bubble, .message-content {
            -webkit-user-select: text;
            user-select: text;
        }

        :root {
            --primary-blue: #00479D;
            --primary-green: #6FBA2C;
            --secondary-green: #4ca61d;
            --secondary-blue: #003366;
            --orange: #FF8C42;
            --light-bg: #f0f4f8;
            --white: #ffffff;
            --text-dark: #333333;
            --text-light: #5C6B7A;
            --shadow-light: rgba(0, 0, 0, 0.08);
            --border-light: #e0e4eb;
            --image-overlay-bg: rgba(0, 0, 0, 0.9);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--light-bg);
            height: 100vh;
            display: flex;
            flex-direction: column;
            cursor: pointer;
        }

        /* ... COPY THE REST OF YOUR ORIGINAL CSS HERE ... */
        /* Make sure to copy ALL styles from your original code */
    </style>
</head>
<body>
    <!-- Header will be populated by JavaScript -->
    <header class="header" id="chatHeader">
        <div class="avatar" id="chatAvatar"></div>
        <div class="header-content">
            <div class="header-title" id="chatTitle"></div>
            <div class="header-subtitle" id="chatSubtitle">
                <span id="chatSubtitleText"></span>
                <span class="status-indicator" aria-label="Online"></span>
            </div>
        </div>
    </header>

    <main class="chat-container">
        <!-- Chat messages will be populated by JavaScript -->
        <div class="chat" id="chatContainer">
            <div class="date-separator" id="dateSeparator">
                <span class="date-label" id="dateLabel"></span>
            </div>
            <!-- Messages will be inserted here -->
        </div>
    </main>

    <!-- Image Viewer Overlay -->
    <div class="image-viewer" id="imageViewer">
        <button class="close-viewer" id="closeViewer">&times;</button>
        <img id="viewedImage" src="" alt="">
        <div class="image-counter" id="imageCounter"></div>
    </div>

    <!-- Load modular JavaScript files -->
    <script src="security-utils.js" nonce="script-nonce"></script>
    <script src="chat-content.js" nonce="script-nonce"></script>
    <script src="chat-engine.js" nonce="script-nonce"></script>
    
    <!-- Initialization Script (small) -->
    <script nonce="script-nonce">
        document.addEventListener('DOMContentLoaded', () => {
            try {
                const chatDemo = new ChatDemo(ChatContent);
                
                // Security measures
                Object.freeze(Object.prototype);
                Object.freeze(Array.prototype);
                Object.freeze(String.prototype);
                
            } catch (error) {
                console.error('Failed to initialize application:', error);
                document.getElementById('chatContainer').innerHTML = 
                    '<div class="error">Application failed to load. Please refresh the page.</div>';
            }
        });

        // Security: Prevent opening of new windows/tabs
        if (window.opener) {
            window.opener = null;
        }
        if (window.top !== window.self) {
            window.top.location = window.self.location;
        }
    </script>
</body>
</html>
